name: Publish v0.1.0

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-v0.1.0.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify version
        shell: bash
        run: test "$(tr -d '[:space:]' < VERSION)" = "0.1.0"

      - name: Run tests
        run: python3 -m unittest scripts/test_clean_draft_lint.py

      - name: Build installable ZIP
        shell: bash
        run: |
          package_dir="dist/professional-report-reviewer"
          mkdir -p "$package_dir"
          cp README.md SKILL.md LICENSE VERSION "$package_dir/"
          cp -R agents assets references scripts tests "$package_dir/"
          find "$package_dir" -type d -name __pycache__ -prune -exec rm -rf {} +
          find "$package_dir" -type f -name '*.pyc' -delete
          cd dist
          zip -qr professional-report-reviewer.zip professional-report-reviewer

      - name: Write release notes
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          First public release of Professional Report Reviewer, a bilingual Agent Skill for reviewing professional reports before external delivery or internal decision use.

          ## Highlights

          - Reviews facts, calculations, reasoning, evidence, comparisons, synthesis, recommendations, structure, and professional language.
          - Preserves valid analysis and asks for confirmation before material changes or substantive deletions.
          - Supports English and Chinese reports.
          - Designed for ChatGPT Desktop, Codex, Claude, Qoder, and other compatible Agent Skills environments.

          Download `professional-report-reviewer.zip`, extract the folder, and add it through your AI environment's Skills interface or documented local skills directory.

          Licensed under the PolyForm Perimeter License 1.0.1.
          EOF

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create v0.1.0 \
            dist/professional-report-reviewer.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Professional Report Reviewer v0.1.0" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --latest
