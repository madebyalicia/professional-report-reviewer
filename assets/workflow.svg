<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-labelledby="title description">
  <title id="title">Professional Report Reviewer workflow</title>
  <desc id="description">Six steps: diagnose, locate issues, give professional verdicts, confirm material changes, revise, and verify.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .diagram-title { font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .step { font: 700 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .detail { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .number { font: 700 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="470" rx="24" fill="#f8fafc"/>
  <text x="600" y="48" text-anchor="middle" class="diagram-title">From report to decision-ready draft</text>

  <path class="arrow" d="M 360 155 L 430 155"/>
  <path class="arrow" d="M 770 155 L 840 155"/>
  <path class="arrow" d="M 1010 218 L 1010 276"/>
  <path class="arrow" d="M 840 345 L 770 345"/>
  <path class="arrow" d="M 430 345 L 360 345"/>

  <g>
    <rect x="40" y="92" width="320" height="126" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="78" cy="127" r="20" fill="#2563eb"/>
    <text x="78" y="132" text-anchor="middle" class="number">1</text>
    <text x="112" y="133" class="step">Diagnose</text>
    <text x="66" y="172" class="detail">Read the whole report and its purpose</text>
    <text x="66" y="195" class="detail">before proposing changes.</text>
  </g>

  <g>
    <rect x="430" y="92" width="340" height="126" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="468" cy="127" r="20" fill="#2563eb"/>
    <text x="468" y="132" text-anchor="middle" class="number">2</text>
    <text x="502" y="133" class="step">Locate issues</text>
    <text x="456" y="172" class="detail">Identify the exact claim, calculation,</text>
    <text x="456" y="195" class="detail">comparison, or recommendation at risk.</text>
  </g>

  <g>
    <rect x="840" y="92" width="320" height="126" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="878" cy="127" r="20" fill="#2563eb"/>
    <text x="878" y="132" text-anchor="middle" class="number">3</text>
    <text x="912" y="133" class="step">Give a verdict</text>
    <text x="866" y="172" class="detail">State what holds, what fails, why,</text>
    <text x="866" y="195" class="detail">and what the evidence supports.</text>
  </g>

  <g>
    <rect x="840" y="282" width="320" height="126" rx="18" fill="#fff7ed" stroke="#fb923c"/>
    <circle cx="878" cy="317" r="20" fill="#ea580c"/>
    <text x="878" y="322" text-anchor="middle" class="number">4</text>
    <text x="912" y="323" class="step">Confirm changes</text>
    <text x="866" y="354" class="detail">Approve changes to meaning or scope;</text>
    <text x="866" y="376" class="detail">confirm restructuring, recommendations,</text>
    <text x="866" y="398" class="detail">and substantive deletions.</text>
  </g>

  <g>
    <rect x="430" y="282" width="340" height="126" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="468" cy="317" r="20" fill="#0f766e"/>
    <text x="468" y="322" text-anchor="middle" class="number">5</text>
    <text x="502" y="323" class="step">Revise</text>
    <text x="456" y="362" class="detail">Fix approved issues while preserving</text>
    <text x="456" y="385" class="detail">valid analysis, evidence, and structure.</text>
  </g>

  <g>
    <rect x="40" y="282" width="320" height="126" rx="18" fill="#ecfdf5" stroke="#10b981"/>
    <circle cx="78" cy="317" r="20" fill="#059669"/>
    <text x="78" y="322" text-anchor="middle" class="number">6</text>
    <text x="112" y="323" class="step">Verify</text>
    <text x="66" y="362" class="detail">Recheck facts, logic, continuity, and</text>
    <text x="66" y="385" class="detail">preservation against the source.</text>
  </g>

  <text x="600" y="448" text-anchor="middle" class="detail">Language-only edits may proceed directly when meaning is unchanged.</text>
</svg>
